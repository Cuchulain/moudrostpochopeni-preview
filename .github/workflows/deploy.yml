name: Deploy to GitHub Pages

# Publishes the static export of the local WordPress (wordpress/export-static.sh),
# committed to the wp-static branch. Pages may only deploy from main, so the
# workflow runs here and checks out the export.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout static export
        uses: actions/checkout@v4
        with:
          ref: wp-static
      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
